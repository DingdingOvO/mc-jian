<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c97830">
  <meta name="description" content="给你的头像戴上 Minecraft 像素挂件 —— 上传头像，选择挂件素材，调好位置一键下载。">
  <meta property="og:title" content="MC挂件 — 头像生成器">
  <meta property="og:description" content="给你的头像戴上 Minecraft 像素挂件">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/assets/Minecraft_franchise_logo.svg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎮</text></svg>">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link rel="preload" href="/assets/Minecraft_franchise_logo.svg" as="image">
  <title>MC挂件 — 头像生成器</title>

  <!-- @performance 内联首屏 CSS 让页面立即渲染，不等外部 CSS -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; background: #f5f1ea; }
    body {
      font: 15px/1.5 -apple-system, system-ui, sans-serif;
      color: #1a1f2e;
      background: linear-gradient(180deg, #f5f1ea 0%, #ebe5db 100%);
      background-attachment: fixed;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 20px 12px 30px;
    }
    /* @why 加载骨架：React 挂载后 #root 内容会替换掉这个 loading 状态 */
    #loading {
      max-width: 640px; width: 100%;
      background: #fff; border: 1px solid #e6e0d8; border-radius: 16px;
      padding: 60px 20px; text-align: center; margin-bottom: 14px;
    }
    #loading .spinner {
      width: 32px; height: 32px; border: 3px solid #f5f1ea;
      border-top-color: #c97830; border-radius: 50%;
      margin: 0 auto 16px; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: #929aa8; font-size: 0.92rem; }
  </style>

  <!-- @performance Font Awesome 延迟加载，不阻塞首次渲染 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" media="print" onload="this.media='all'" crossorigin="anonymous">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"></noscript>
</head>
<body>
  <div id="root">
    <div id="loading">
      <div class="spinner"></div>
      <p>MC挂件 加载中…</p>
    </div>
  </div>
</body>
</html>
