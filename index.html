<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#c97830" />
		<meta name="description" content="给你的头像戴上 Minecraft 像素挂件 —— 上传头像，选择挂件素材，调好位置一键下载。" />
		<meta property="og:title" content="MC挂件 — 头像生成器" />
		<meta property="og:description" content="给你的头像戴上 Minecraft 像素挂件" />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="/assets/Minecraft_franchise_logo.svg" />
		<link rel="icon" href="/assets/Minecraft_franchise_logo.svg" type="image/svg+xml" />
		<title>MC挂件 — 头像生成器</title>
		<script>
			// 阻塞渲染前注入主题，消除闪白
			(function(){
				var t; try { t = localStorage.getItem('mc-theme'); } catch(e) {}
				var d = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme:dark)').matches);
				if (d) {
					document.documentElement.setAttribute('data-theme','dark');
					document.documentElement.style.colorScheme = 'dark';
					var m = document.querySelector('meta[name="theme-color"]');
					if (m) m.content = '#1a1814';
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/index.tsx"></script>
	</body>
</html>
